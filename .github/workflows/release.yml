name: Release

# Archives the iOS app when a version tag is pushed and uploads it to App
# Store Connect. Ported from KyPost-for-Mac's release.yml, iOS path only:
# KyAuth has no Mac app and no Developer ID build.
#
# Two gates run before anything reaches Apple, because both failures are
# silent and expensive: App Store Connect files a build under whatever
# CFBundleShortVersionString and CFBundleVersion it carries, and neither can
# be corrected after upload.
#
#   scripts/verify-version.sh  the tag equals MARKETING_VERSION, and every
#                              build configuration of every target agrees on
#                              MARKETING_VERSION and CURRENT_PROJECT_VERSION.
#   scripts/verify-archive.sh  the app and every extension in the archive
#                              (KyAuthPush must be there) carry those numbers
#                              and are signed by the project's team, which is
#                              also the teamID in ExportOptions-iOS.plist.
#
# THE BUILD NUMBER IS THE PROJECT'S. Unlike KyPost, nothing overrides
# CURRENT_PROJECT_VERSION: the release commit sets it (0.6.0 is build 4) and
# that exact number is uploaded. A run that failed before the upload step can
# be re-run as it is. Once a build is on App Store Connect the same number is
# refused, so a new upload needs a release commit with a higher
# CURRENT_PROJECT_VERSION and a tag on that commit.
#
# SIGNING IS AUTOMATIC, with an App Store Connect API key.
#
#   archive        signs with an Apple Development identity. xcodebuild
#                  creates or refreshes the development profiles of the app
#                  and of KyAuthPush itself (-allowProvisioningUpdates plus
#                  the API key).
#   -exportArchive re-signs for the store with the team's cloud-managed
#                  Apple Distribution certificate and fetches an App Store
#                  profile for each of the two bundle IDs. No distribution
#                  certificate or profile exists as a secret.
#
# The development certificate IS a secret, and that is deliberate. Left to
# itself, xcodebuild creates a new "Apple Development: Created via API"
# certificate on a runner that has none, keeps the private key only in that
# runner's keychain, and on the next fresh runner refuses: "Your account
# already has an Apple Development signing certificate for this machine, but
# its private key is not installed in your keychain." Importing one fixed
# development identity is the known way out (see KyPost-for-Mac's
# release.yml for the history).
#
# ONE-TIME SETUP — what the maintainer creates (nothing here creates it):
#
#   GitHub → KyAuth-iOS → Settings → Environments → New environment named
#   `release`. Add required reviewers and limit deployment to tags matching
#   `v*`, so a tag pushed by anyone with write access cannot reach App Store
#   Connect alone. Then add these environment secrets. KyAuth and KyPost are
#   both team TATYN4X57D, so these are the same values as KyPost-for-Mac's
#   `release` environment:
#
#   APP_STORE_CONNECT_PRIVATE_KEY   the .p8 file, base64-encoded
#                                   (`base64 -i AuthKey_XXXX.p8 | pbcopy`).
#                                   Users and Access → Integrations → Team
#                                   Keys. The key MUST have the Admin role:
#                                   cloud-managed distribution certificates
#                                   are refused to every other role.
#   APP_STORE_CONNECT_KEY_ID        the key's ID (10 characters).
#   APP_STORE_CONNECT_ISSUER_ID     the issuer UUID shown above the key list.
#   APPLE_DEVELOPMENT_CERTIFICATE   an Apple Development certificate of team
#                                   TATYN4X57D with its private key, exported
#                                   from Keychain Access as .p12, base64-encoded.
#   APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD
#                                   the password chosen for that .p12 export.
#
#   The team needs at least one registered iOS device: automatic signing
#   cannot create an iOS development profile for a team with none.

on:
  push:
    tags:
      - "v*"

# Not concurrency-cancelled. A half-finished upload is worse than a slow one.
permissions:
  contents: read

jobs:
  release:
    name: Upload to App Store Connect
    runs-on: macos-26
    timeout-minutes: 90
    # Secrets live on a protected environment so a tag pushed by anyone with
    # write access cannot silently reach App Store Connect.
    environment: release

    env:
      DEVELOPMENT_CERTIFICATE: ${{ secrets.APPLE_DEVELOPMENT_CERTIFICATE }}
      DEVELOPMENT_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fail on a missing secret before spending half an hour on tests and an
      # archive that cannot be signed, and name the one that is missing rather
      # than letting codesign report it as something else.
      - name: Required secrets are present
        run: |
          set -euo pipefail
          missing=""
          for name in DEVELOPMENT_CERTIFICATE DEVELOPMENT_CERTIFICATE_PASSWORD \
                      ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            eval "value=\${$name:-}"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing release secrets on the 'release' environment:$missing"
            exit 1
          fi

      # Same selection as tests.yml: the images carry several 26.x and rename
      # them as they update, so an exact path breaks on an image refresh.
      - name: Select Xcode 26
        run: |
          shopt -s nullglob
          xcodes=(/Applications/Xcode_26*.app)
          [ "${#xcodes[@]}" -gt 0 ] || { echo '::error::no Xcode 26 on this runner'; exit 1; }
          xcode=$(printf '%s\n' "${xcodes[@]}" | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      # The tag is attacker-influenceable text: git permits `$` and backticks
      # in a tag name, so it goes through the environment and never into the
      # shell source.
      - name: Tag matches MARKETING_VERSION
        env:
          TAG: ${{ github.ref_name }}
        run: ./scripts/verify-version.sh "$TAG"

      # The suite runs here as well as in tests.yml, the same way, so a tag is
      # never uploaded on the strength of an older commit's green check.
      - name: Select an available iPhone simulator
        id: destination
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for group in devices.values() for d in group if d["name"].startswith("iPhone")))')
          echo "id=$device" >> "$GITHUB_OUTPUT"
      - name: Set up the standard-library TLS fixture server
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache-dependency-path: scripts/tls-fixtures/go.mod
      - name: Verify host TLS fixtures
        run: GODEBUG=fips140=off go -C scripts/tls-fixtures test -race -count=1 ./...
      - name: Configure the disposable runner's fixture hostname
        run: printf '127.0.0.1 kyauth-tls-test.invalid\n' | sudo tee -a /etc/hosts > /dev/null
      - name: Run the complete simulator test suite
        env:
          SIMULATOR_ID: ${{ steps.destination.outputs.id }}
        run: bash scripts/test-ios.sh "$SIMULATOR_ID"

      - name: Install the development identity
        run: |
          set -euo pipefail
          KEYCHAIN=$RUNNER_TEMP/release.keychain-db
          PASSWORD=$(uuidgen)

          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"

          echo "$DEVELOPMENT_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/dev.p12"
          security import "$RUNNER_TEMP/dev.p12" -k "$KEYCHAIN" \
            -P "$DEVELOPMENT_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/dev.p12"

          # Without this codesign blocks on a GUI prompt no one can answer and
          # the job hangs until it times out rather than failing.
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

      - name: App Store Connect API key
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$ASC_PRIVATE_KEY" | base64 --decode \
            > "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      # Release configuration (the scheme's archive action), app and
      # KyAuthPush. CODE_SIGN_STYLE stays Automatic and CURRENT_PROJECT_VERSION
      # stays what project.pbxproj says.
      - name: Archive
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project KyAuth.xcodeproj \
            -scheme KyAuth \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/KyAuth.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Archive carries the expected team and build number
        run: ./scripts/verify-archive.sh "$RUNNER_TEMP/KyAuth.xcarchive"

      # Export and upload are one step: ExportOptions carries
      # destination=upload, so there is no intermediate artifact for a later
      # step to upload the wrong copy of.
      - name: Upload to App Store Connect
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/KyAuth.xcarchive" \
            -exportOptionsPlist Distribution/ExportOptions-iOS.plist \
            -exportPath "$RUNNER_TEMP/export-iOS" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove the signing keychain
        # `always()`: a keychain holding the team's development identity, and
        # a private key that can upload to App Store Connect, should not
        # outlive the job even when the job failed.
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
          rm -rf "$RUNNER_TEMP/private_keys"
